name: Build

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build:
    name: build / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # ── Linux ────────────────────────────────────────────────────────────
      - name: Install libpcap (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y libpcap-dev

      # ── Windows ──────────────────────────────────────────────────────────
      # SDK headers + import libs for cgo compilation only.
      # No Npcap runtime: unit tests run with -short (pcap calls skipped),
      # and pcap integration tests are covered by Linux + macOS runners.
      - name: Install Npcap SDK (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 5
        shell: pwsh
        run: |
          curl.exe -L -o npcap-sdk.zip --max-time 60 --retry 3 --retry-delay 5 https://npcap.com/dist/npcap-sdk-1.13.zip
          Expand-Archive npcap-sdk.zip -DestinationPath C:\npcap-sdk
          echo "LIB=C:\npcap-sdk\Lib\x64" >> $env:GITHUB_ENV
          echo "CGO_LDFLAGS=-L C:\npcap-sdk\Lib\x64" >> $env:GITHUB_ENV

      # ── Build + vet ───────────────────────────────────────────────────────
      - name: go build
        run: go build -v ./...

      - name: go vet
        run: go vet ./...

      # ── Unit tests (no pcap required) ─────────────────────────────────────
      - name: go test (unit, -short)
        run: go test ./... -short -timeout 60s

      # ── Pcap tests: Linux (sudo + setcap) ────────────────────────────────
      # Grant CAP_NET_RAW to the test binary so pcap.FindAllDevs/OpenLive work
      - name: go test (pcap, Linux)
        if: runner.os == 'Linux'
        run: |
          go test -c -o /tmp/device.test ./pkg/device/
          sudo setcap cap_net_raw,cap_net_admin=eip /tmp/device.test
          /tmp/device.test -test.v -test.timeout 90s

      # ── Pcap tests: macOS (sudo) ───────────────────────────────────────────
      - name: go test (pcap, macOS)
        if: runner.os == 'macOS'
        run: sudo go test ./pkg/device/... -v -timeout 90s

      # Windows pcap integration tests skipped: no reliable Npcap runtime on
      # GitHub Actions runners. Coverage provided by Linux + macOS pcap steps.
